[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docformat"
dynamic = ["version"]
description = "Turn raw Word drafts into publish-ready, template-conformant documents — offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "psrsas2905", email = "psrsas2905@gmail.com" }]
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = []          # Ollama is a separate binary; nothing to pip-install here yet.
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
docformat = "docformat.cli:app"

[tool.setuptools.dynamic]
version = { attr = "docformat.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
docformat = ["assets/*.html"]
