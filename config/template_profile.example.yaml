# Template profile — describes ONE organization's standard template.
# The tool pours source content into these named styles.
# Duplicate + edit this file per organization / per template.

name: "Acme Corp Standard v3"

# Path to the actual .dotx/.docx template whose styles we apply.
# Styles referenced below must exist inside this template.
# (Stand-in generated by scripts/make_template.py; swap in the real org template.)
template_file: "templates/org_standard.docx"

# Map our internal block labels -> the named style in the template.
# LHS = docformat's BlockType; RHS = exact style name in the template.
style_map:
  Heading1: "Heading 1"
  Heading2: "Heading 2"
  Heading3: "Heading 3"
  Body:     "Body Text"
  Caption:  "Caption"
  ListItem: "List Bullet"
  Quote:    "Quote"

page:
  size: "A4"          # A4 | Letter
  margins_mm:
    top: 25
    bottom: 25
    left: 25
    right: 25

header:
  text: "{doc_title}"
  show_on_first_page: false

footer:
  # Tokens: {page}, {pages}, {doc_title}, {version}, {classification}
  text: "{classification}  |  Page {page} of {pages}"
  classification: "Internal"

toc:
  enabled: true
  title: "Table of Contents"
  max_level: 3

list_of_figures:
  enabled: true
  title: "List of Figures"

# Output file naming. Tokens: {basename}, {version}, {date}
output:
  filename: "{basename}_v{version}_{date}"
  version: "1.0"
  export_pdf: true

# Named table style applied to carried-through tables.
table_style: "Table Grid"
